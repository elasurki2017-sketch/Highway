<style>

h3{
    text-align: center;
}


/* =========================
RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter','Plus Jakarta Sans',Arial,sans-serif;
}

html{
    width:100%;
    overflow-x:hidden;
}

body{
    background:
        radial-gradient(1200px 500px at 100% -10%, rgba(229,57,53,.06), transparent 60%),
        radial-gradient(1000px 500px at -10% 0%, rgba(30,64,175,.05), transparent 55%),
        #eef1f6;
    padding:14px;
    min-height:100vh;
    overflow-x:hidden;
    color:#1f2430;
}

/* =========================
HEADER
========================= */
.header{
    position:sticky;
    top:0;
    z-index:10000;
    background:rgba(238,241,246,.85);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:transform .3s ease;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:18px;
    padding:10px 14px;
    border-radius:16px;
    flex-wrap:wrap;
}

.header.hide-header{
    transform:translateY(-100%);
}

.company h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14px;
    font-weight:800;
    letter-spacing:.2px;
    line-height:1.3;
    background:linear-gradient(90deg,#c62828,#e53935 55%,#ef5350);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.company p{
    font-size:10px;
    font-weight:600;
    color:#94a3b8;
    letter-spacing:.3px;
    margin-top:2px;
}

.profile-name{
    font-size:9px;
    margin-top:6px;
    color:#334155;
    font-weight:700;
    text-transform:uppercase;
    line-height:1.2;
}

.profile{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 10px rgba(30,41,59,.12), inset 0 0 0 1px rgba(15,23,42,.05);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
}

.profile:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(30,41,59,.18), inset 0 0 0 1px rgba(15,23,42,.05);
}

/* =========================
MENU CARD
========================= */

.menu-card,
.period-card,
.table-card{
    background:#ffffff;
    padding:20px;
    border-radius:18px;
    box-shadow:0 1px 2px rgba(15,23,42,.04), 0 10px 30px -12px rgba(15,23,42,.12);
    border:1px solid rgba(15,23,42,.04);
    margin-bottom:18px;
}

.menu-card{
    padding:10px;
}

.menu-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.menu-btn:hover{
    background:#e2e8f0;
}

.menu-btn.active:hover{
    background:#c62828;
}

/* =========================
PERIOD
========================= */

.period-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:nowrap;
}

.period-row label{
    font-weight:700;
    font-size:13px;
    color:#475569;
    margin-right:2px;
}

#monthSelect,
#yearSelect{
    height:40px;
    width:140px;
    padding:0 14px;
    border:1.5px solid #e2e8f0;
    border-radius:10px;
    background:#f8fafc;
    color:#1f2430;

    font-size:14px;
    font-weight:700;

    text-align:center;
    text-align-last:center;

    appearance:none;
    -webkit-appearance:none;
    transition:border-color .15s ease, box-shadow .15s ease;
}

#monthSelect:focus,
#yearSelect:focus{
    outline:none;
    border-color:#e53935;
    box-shadow:0 0 0 3px rgba(229,57,53,.12);
}

/* =========================
TABLE
========================= */

.table-header{
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
}
.table-header h4{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14px;
    font-weight:800;
    color:#1e293b;
    position:relative;
    padding-left:12px;
}

.table-header h4::before{
    content:"";
    position:absolute;
    left:0;
    top:1px;
    bottom:1px;
    width:4px;
    border-radius:4px;
    background:linear-gradient(180deg,#e53935,#f57c00);
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border-radius:12px;
}



/* =========================
TABLE
========================= */

#mainTable{
    width:100%;
    min-width:900px;
    border-collapse:separate;
    border-spacing:0;
    border:1px solid #333333;
    border-radius:12px;
    overflow:hidden;
    table-layout:fixed;
}

/* Date */
th:nth-child(1),
td.date-cell{
    width:40px;
    min-width:40px;
    max-width:40px;
    padding:2px;
    text-align:center;
}
/* No */
th:nth-child(2),
td.no-cell{
    width:35px;
    min-width:35px;
    max-width:35px;
    text-align:center;
}

.hidden-datefull{
    display:none;
    width:0 !important;
    min-width:0 !important;
    max-width:0 !important;
    padding:0 !important;
    border:none !important;
}
/* Start = kolom 4 */
th:nth-child(4),
td:nth-child(4){
    width:130px;
    min-width:130px;
    max-width:130px;
}

/* Arrive = kolom 5 */
th:nth-child(5),
td:nth-child(5){
    width:130px;
    min-width:130px;
    max-width:130px;
}

/* Parking = kolom 6 */
th:nth-child(6),
td:nth-child(6){
    width:130px;
    min-width:130px;
    max-width:130px;
}

/* Flazz = kolom 7 */
th:nth-child(7){
    width:60px;
    min-width:60px;
    max-width:60px;
}

td:nth-child(7){
    width:60px;
    min-width:60px;
    padding-right:6px;
}

/* Cash = kolom 8 */
th:nth-child(8){
    width:60px;
    min-width:60px;
    max-width:60px;
}

td:nth-child(8){
    width:60px;
    min-width:60px;
    max-width:60px;
    padding-right:6px;
}

/* KM = kolom 9 */
th:nth-child(9),
td:nth-child(9){
    width:60px;
    min-width:60px;
    max-width:60px;
}
/* Total = kolom 10 */
th:nth-child(10),
td:nth-child(10){
    width:70px;
    min-width:70px;
    max-width:70px;
}

th:nth-child(11),
td:nth-child(11),
.action-cell{
    width:70px;
    min-width:70px;
    max-width:70px;
    text-align:center;
    padding:0 !important;
}

.center-cell{
    text-align:center;
    vertical-align:middle;
}

.money-cell{
    text-align:right;
    padding-right:8px;
}

.no-cell{
    text-align:center;
    font-weight:bold;
    vertical-align:middle;
}

th{
    background:linear-gradient(180deg,#4b5563,#374151);
    color:#f1f5f9;
    border:1px solid #333333;
    padding:11px 8px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.3px;
    white-space:nowrap;
}

td{
    border:1px solid #333333;
    padding:6px 7px;
    font-size:9px;
    line-height:1.2;
    height:28px;
    vertical-align:middle;
    color:#334155;
}


.date-cell{
    text-align:center;
    vertical-align:middle;
    font-weight:700;
    font-size:13px;
    color:#e53935;
}
.total-cell{
    text-align:center;
    font-weight:700;
    font-size:11px;
    color:#166534;
    border:1px solid #333333;
}

.placeholder{
    color:#b0b8c4;
    text-align:center;
}

.group-even td,
.group-even .date-cell,
.group-even .total-cell{
    background:#ffffff;
}

.group-odd td,
.group-odd .date-cell,
.group-odd .total-cell{
    background:#e2e8f0;
}

/* =========================
ACTION BUTTONS
========================= */

.action-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
}
.action-btn{
    border:none;
    background:transparent;
    cursor:pointer;
    font-size:13px;
    padding:2px;
    width:22px;
    height:22px;
    line-height:1;
    border-radius:6px;
    transition:background .15s ease, transform .1s ease;
}

.action-btn:hover{
    background:rgba(229,57,53,.1);
    transform:translateY(-1px);
}

/* =========================
BOTTOM ACTIONS
========================= */

.bottom-actions{
    margin-top:16px;
    display:flex;
    justify-content:flex-end;
}
.subtotal-box{
    min-width:230px;
    border:1px solid #fde0df;
    padding:12px 16px;
    border-radius:12px;
    background:linear-gradient(135deg,#fff5f5,#fff);
    font-size:13px;
    font-weight:700;
    color:#334155;
    box-shadow:0 4px 14px -6px rgba(229,57,53,.2);
}

.subtotal-value{
    float:right;
    color:#e53935;
    font-weight:800;
}
/* =========================
MODAL BASE
========================= */
.modal-overlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(15,23,42,.45);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    z-index:10000;
    padding:20px;
}

.modal-card{
    width:100%;
    max-width:720px;
    background:#fff;
    border-radius:20px;
    padding:24px;
    box-shadow:0 20px 60px -12px rgba(15,23,42,.35);
    border:1px solid rgba(15,23,42,.05);
    animation:modalPop .18s ease;
}
@keyframes modalPop{
    from{ opacity:0; transform:translateY(6px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

/* =========================
APP LOADING + SAVE LOADING
========================= */

.loading-overlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:14px;

    background:rgba(15,23,42,.72);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    z-index:20000;
    padding:20px;

    opacity:0;
    transition:opacity .35s ease;
}

.loading-overlay.show{
    display:flex;
    opacity:1;
}

.loading-box{
    width:180px;
    padding:24px 18px;
    border-radius:20px;
    background:rgba(255,255,255,.96);
    box-shadow:0 20px 60px rgba(15,23,42,.30);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    animation:loadingBoxIn .45s cubic-bezier(.22,1,.36,1);
}

.loading-spinner{
    width:52px;
    height:52px;

    border-radius:50%;
    border:4px solid #e2e8f0;
    border-top-color:#e53935;

    animation:
        spin .8s linear infinite,
        spinnerPulse 1.5s ease-in-out infinite;
}

.loading-text{
    margin-top:14px;

    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:12px;
    font-weight:700;

    color:#334155;
    text-align:center;
    letter-spacing:.1px;

    min-height:18px;
}

.loading-success{
    display:none;

    width:52px;
    height:52px;

    border-radius:50%;
    background:#16a34a;
    color:#fff;

    font-size:30px;
    font-weight:800;

    align-items:center;
    justify-content:center;

    animation:successPop .45s cubic-bezier(.22,1,.36,1);
}

.loading-overlay.success .loading-spinner{
    display:none;
}

.loading-overlay.success .loading-success{
    display:flex;
}

.loading-overlay.success .loading-text{
    color:#166534;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes spinnerPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

@keyframes loadingBoxIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.92);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes successPop{
    0%{
        opacity:0;
        transform:scale(.4);
    }

    70%{
        transform:scale(1.12);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
}

h3{

    color:#1e293b;

}

/* =========================
PROFILE TABLE
========================= */
/* td kanan */
.profile-table td:last-child{

/* =========================
TITLE
========================= */
.modal-title{

    font-size:17px;

    margin-bottom:18px;
    color:#1e293b;

}

/* =========================
INPUT
========================= */

input,select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #e2e8f0;
    background:#f8fafc;
    border-radius:10px;
    outline:none;
    font-size:12px;
    color:#1f2430;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}

input:focus,select:focus{
    border-color:#e53935;
    background:#fff;
    box-shadow:0 0 0 3px rgba(229,57,53,.12);
}

#inputFlazz,
#inputCash,
#inputKm{
    text-align:center;
}

.currency-input{
    text-align:center;
}

/* =========================
INPUT GRID
========================= */
.input-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:20px;
}

.full{
    grid-column:1 / span 2;
}

/* =========================
BUTTONS
========================= */

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:20px;
    margin-top:25px;   
}

.primary-btn{
    border:none;
    padding:11px 22px;
    cursor:pointer;
    border-radius:10px;
    background:linear-gradient(135deg,#e53935,#c62828);
    color:white;
    font-size:12px;
    font-weight:700;
    letter-spacing:.2px;
    box-shadow:0 6px 16px -6px rgba(198,40,40,.55);
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}

.primary-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 20px -8px rgba(198,40,40,.6);
    filter:brightness(1.03);
}
.primary-btn:active{
    transform:translateY(0);
    filter:brightness(.97);
}

.secondary-btn{
    background:linear-gradient(135deg,#94a3b8,#64748b);
    box-shadow:0 6px 16px -6px rgba(71,85,105,.4);
}

/* =========================
DELETE CONFIRM
========================= */
.confirm-box{
    width:100%;
    max-width:360px;
    background:#fff;
    border-radius:18px;
    padding:26px;
    text-align:center;
    box-shadow:0 20px 60px -12px rgba(15,23,42,.35);
}

.confirm-text{
    font-size:14px;
    font-weight:600;
    color:#334155;
    margin-bottom:20px;
}

.confirm-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
}

/* =========================
MOBILE
========================= */

@media(max-width:768px){
    .full{
        grid-column:auto;
    }

    .form-actions{
        flex-direction:column;
    }

    .primary-btn{
        width:100%;
    }

    .bottom-actions{
        flex-direction:column;
        align-items:stretch;
    }

}
.menu-btn{
    flex:1;
    max-width:180px;
    height:46px;
    border:none;
    border-radius:12px;
    background:transparent;
    color:#64748b;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.menu-btn.active{
    background:linear-gradient(135deg,#e53935,#c62828);
    color:#fff;
    box-shadow:0 6px 16px -6px rgba(198,40,40,.5);
}

}

.modal-buttons{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
}
}


.input-grid label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    font-size:12px;
    color:#475569;
}

::-webkit-scrollbar{
    height:8px;
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:8px;
}

::-webkit-scrollbar-thumb:hover{
    background:#94a3b8;
}

</style>

/**
 * Format angka menjadi Rupiah
 * Contoh: 15000 -> "Rp 15.000"
 */
const loadingOverlay =
    document.getElementById("loadingOverlay");

const loadingText =
    loadingOverlay.querySelector(".loading-text");

function showLoading(message = "Memuat aplikasi..."){

    loadingOverlay.classList.remove("success");

    loadingText.textContent = message;

    loadingOverlay.classList.add("show");
}


function showSuccess(message = "Data berhasil disimpan"){

    loadingText.textContent = message;

    loadingOverlay.classList.add("success");
}


function hideLoading(){

    loadingOverlay.classList.remove("show");

    setTimeout(() => {

        loadingOverlay.classList.remove("success");

    }, 350);
}
function formatRupiah(value) {

    value = String(value).replace(/\D/g, "");

    if (value === "") {
        return "";
    }

    return "Rp " + Number(value).toLocaleString("id-ID");
}

/**
 * Mengubah teks Rupiah menjadi Number
 * Contoh:
 * "Rp 15.000" -> 15000
 */
function parseRupiah(value) {

    return Number(
        String(value).replace(/[^\d]/g, "") || 0
    );

}

/**
 * Mengambil tanggal dari format YYYY-MM-DD
 * Contoh:
 * 2026-07-26 -> 26
 */
function extractDate(dateFull) {

    if (!dateFull) {
        return "";
    }
    const date = new Date(dateFull);

    if (isNaN(date.getTime())) {
        return "";
    }

    return date.getDate();

}

/**
 * Menghitung total Flazz + Cash
 */
function calculateTotal(flazz, cash) {
    return Number(flazz || 0) +
           Number(cash || 0);

}

/**
 * Menghitung subtotal seluruh data Highway
 */
function calculateSubtotal(data = tableData) {

    return data.reduce((total, item) => {

        return total +
            Number(item.flazz || 0) +
            Number(item.cash || 0);

    }, 0);

}

/**

const monthMap = {
    Januari: 1,
    Februari: 2,
    Maret: 3,
    April: 4,
    Mei: 5,
    Juni: 6,
    Juli: 7,
    Agustus: 8,
    September: 9,
    Oktober: 10,
    November: 11,
    Desember: 12

};

/**
 * Mengembalikan data sesuai periode yang dipilih
 */
function getFilteredData() {

    const month = monthSelect.value;
    const year = Number(yearSelect.value);

    if (!month || !year) {
        return tableData;
    }

    return tableData.filter(item => {

        if (!item.dateFull) return false;

        const date = new Date(item.dateFull);

        return (
            date.getMonth() + 1 === monthMap[month] &&
            date.getFullYear() === year
        );

    });
}
/**
 * Menerapkan filter periode ke tabel
 */
function applyPeriodFilter() {

    const filteredData = getFilteredData();

    renderTable(filteredData);

}

/**
 * Mengirim data ke Google Apps Script
 */
async function sendApi(data) {

    try {

        const form = new FormData();

        form.append(
            "data",
            JSON.stringify(data)
        );

        const response = await fetch(API_URL, {
            method: "POST",
            body: form
        });
        const result = await response.json();

        if (result.status) {
            return true;
        }

        alert(
            result.error ||
            "Gagal menyimpan data."
        );

        return false;

    } catch (err) {

        alert(
            "Error : " + err.message
        );

        return false;
    }
}
/**
 * Reload data Highway
 */
/* =====================================================
HIGHWAY V2
PART 9 - RELOAD HIGHWAY
===================================================== */

async function reloadHighway() {

    try {

        console.log("Reload Highway...");

        const period =
            monthSelect.value + "-" + yearSelect.value;
        return new Promise((resolve) => {

            const callback =
                "highwayCallback_" + Date.now();
            const script =
                document.createElement("script");

            function cleanup() {

                delete window[callback];

                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }

            }

            window[callback] = function (rows) {

                cleanup();

                tableData =
                    Array.isArray(rows) ? rows : [];

                applyPeriodFilter();

                console.log(
                    "Highway rows :",
                    tableData.length
                );

                resolve(tableData);

            };

            script.src =
                API_URL +
                "?callback=" +
                callback +
                "&period=" +
                encodeURIComponent(period);

            script.onerror = function () {

                cleanup();
                console.error(
                    "Gagal mengambil data Highway."
                );
                tableData = [];

                renderTable([]);

                resolve([]);

            };

            document.head.appendChild(script);

        });
    } catch (err) {

        console.error(err);

        return [];

    }
}

/**
 * Update subtotal
 */
function updateSubtotal(data = tableData) {

    const subtotal = calculateSubtotal(data);

    subtotalValue.textContent =
        formatRupiah(subtotal);

}
/**
 * Render seluruh tabel Highway
 */
function renderTable(data = tableData) {

    if (!data.length) {
        renderEmptyTable();
        updateSubtotal([]);
        return;
    }

    data.sort((a, b) =>
        new Date(a.dateFull) -
        new Date(b.dateFull)
    );

    const grouped = groupByDate(data);

    let html = "";

    Object.keys(grouped).forEach((dateKey, groupIndex) => {

        const rows = grouped[dateKey];

        const rowClass =
            groupIndex % 2 === 0
            ? "group-even"
            : "group-odd";

        const total = calculateSubtotal(rows);

        rows.forEach((row, rowIndex) => {
            html += createHighwayRow(
                row,
                rows,
                rowIndex,
                rowClass,
                total
            );

        });

    });

    tableBody.innerHTML = html;

    updateSubtotal(data);

}


/* =====================================================
GROUP DATA
===================================================== */

function groupByDate(data) {

    const grouped = {};
    data.forEach(item => {

        if (!grouped[item.dateFull]) {
            grouped[item.dateFull] = [];
        }

        grouped[item.dateFull].push(item);

    });

    return grouped;

}

function clearForm() {

    inputDateFull.value = "";
    inputStart.value = "";
    inputArrive.value = "";
    inputParking.value = "";
    inputFlazz.value = "";
    inputCash.value = "";
    inputKm.value = "";

/**
 * Mengisi form saat Edit
 */
function fillForm(data) {

    inputDateFull.value = data.dateFull || "";
    inputStart.value = data.start || "";
    inputArrive.value = data.arrive || "";
    inputParking.value = data.parking || "";

    inputFlazz.value =
        data.flazz
        ? formatRupiah(data.flazz)
        : "";

    inputCash.value =
        data.cash
        ? formatRupiah(data.cash)
        : "";

    inputKm.value = data.km || "";
}

/**
 * Mengambil data dari form
 */
function getFormData() {

    const flazz = parseRupiah(inputFlazz.value);
    const cash = parseRupiah(inputCash.value);

    return {

        id: editIndex || generateId(),

        dateFull: inputDateFull.value,

        start: inputStart.value.trim(),

        arrive: inputArrive.value.trim(),

        parking: inputParking.value.trim(),

        flazz: flazz === 0 ? "" : flazz,

        cash: cash === 0 ? "" : cash,

        km: inputKm.value.trim(),

        period:
            monthSelect.value +
            "-" +
            yearSelect.value

    };

}

/**
 * Validasi Form
 */
function validateForm() {
    if (!inputDateFull.value) {
        alert("Date wajib diisi.");
        inputDateFull.focus();
        return false;
    }
    const lokasi =
        inputStart.value.trim() ||
        inputArrive.value.trim() ||
        inputParking.value.trim();

    if (!lokasi) {
        alert("Isi minimal Start, Arrive, atau Parking.");
        return false;
    }

    const biaya =
        parseRupiah(inputFlazz.value) +
        parseRupiah(inputCash.value);

    if (biaya === 0) {
        alert("Isi minimal Flazz atau Cash.");
        return false;
    }

    return true;
}

/**
 * Validasi periode
 */
function validatePeriod() {

    const namaBulan = [
        "Januari","Februari","Maret","April",
        "Mei","Juni","Juli","Agustus",
        "September","Oktober","November","Desember"
    ];

    const [tahun, bulan] =
        inputDateFull.value.split("-");

    const periodeCard =
        monthSelect.value +
        "-" +
        yearSelect.value;
    const periodeTanggal =
        namaBulan[Number(bulan) - 1] +
        "-" +
        tahun;

    if (periodeCard !== periodeTanggal) {

        alert(
            `Periode harus sama.\n\n` +
            `Period Card : ${periodeCard}\n` +
            `Tanggal : ${periodeTanggal}`
        );

        inputDateFull.focus();

        return false;

    }
    return true;
}

/**

saveRowBtn.onclick = async function () {

    if (!validateProfilePeriod()) return;
    if (!validateForm()) return;
    if (!validatePeriod()) return;

    saveLastPeriod();

    if (!confirm("Data sudah benar?")) {
        return;
    }

    const data = getFormData();
    data.action = editIndex
        ? "update"
        : "add";

    showLoading("Menyimpan data Highway...");

    const success = await sendApi(data);

    if (!success) {
        hideLoading();
        return;
    }
    showLoading("Memperbarui data...");

    await reloadHighway();

    showSuccess("Data Highway berhasil disimpan");

    await new Promise(resolve =>
        setTimeout(resolve, 800)
    );

    hideLoading();

    clearForm();
    closeModal(formModal);

};

/**

 */
function setProfileLock(lock) {

    profileLocked = lock;

    const fields = [
        "employeeName",
        "employeeNik",
        "employeeUser",
        "employeeLocation"
    ];

    fields.forEach(id => {
        document.getElementById(id).readOnly = lock;
    });

    saveProfileBtn.textContent = lock
        ? "Edit"
        : "Save";
}

/**
 * Menyimpan Profile
 */
function saveProfile() {

    const profile = {

        employeeName:
            document.getElementById("employeeName")
            .value.trim(),

        employeeNik:
            document.getElementById("employeeNik")
            .value.trim(),
        employeeUser:
            document.getElementById("employeeUser")
            .value.trim(),
        employeeCar:
            document.getElementById("employeeLocation")
            .value.trim()

    };

    localStorage.setItem(
        "employeeName",
        profile.employeeName
    );

    localStorage.setItem(
        "employeeNik",
        profile.employeeNik
    );

    localStorage.setItem(
        "employeeUser",
        profile.employeeUser
    );
    localStorage.setItem(
        "employeeCar",
        profile.employeeCar
    );

    profileNameDisplay.textContent =
        profile.employeeName;

    setProfileLock(true);

}

/**
 * Memuat Profile
 */
function loadProfile() {

    const profile = {
        employeeName:
            localStorage.getItem("employeeName") || "",

        employeeNik:
            localStorage.getItem("employeeNik") || "",

        employeeUser:
            localStorage.getItem("employeeUser") || "",

        employeeCar:
            localStorage.getItem("employeeCar") || ""

    };

    document.getElementById("employeeName").value =
        profile.employeeName;

    document.getElementById("employeeNik").value =
        profile.employeeNik;

    document.getElementById("employeeUser").value =
        profile.employeeUser;
    document.getElementById("employeeLocation").value =
        profile.employeeCar;

    profileNameDisplay.textContent =
        profile.employeeName;

    setProfileLock(
        profile.employeeName !== ""
    );

}

/**
 * Mengambil Profile
 */
function getProfile() {

    return {

        name:
            localStorage.getItem("employeeName") || "",

        nik:
            localStorage.getItem("employeeNik") || "",

        user:
            localStorage.getItem("employeeUser") || "",

        car:
            localStorage.getItem("employeeCar") || ""

    };

}
/**
 * Validasi Profile
 */
function validateProfilePeriod() {

    if (!monthSelect.value || !yearSelect.value) {
        alert("Silakan pilih periode terlebih dahulu.");

        return false;

    }

    const profile = getProfile();

    if (
        !profile.name ||
        !profile.nik ||
        !profile.user ||
        !profile.car
    ) {

        alert("Lengkapi Profile terlebih dahulu.");

        openModal(profileModal);

        return false;
    }
    return true;

/**
 * Memuat gambar tanda tangan
 */
function loadSignature() {

    return new Promise(resolve => {

        const img =
            document.getElementById("signImage");

        if (!img) {

            resolve(null);
            return;

        }

        if (img.complete) {
            resolve(img);

        } else {

            img.onload = () => resolve(img);

            img.onerror = () => resolve(null);

        }

    });

}

/**
 * Reload seluruh data Highway
 */
async function initializeHighway() {

    try {
        loadProfile();

        loadLastPeriod();

        await reloadHighway();

    } catch (err) {

        console.error(err);
        alert("Gagal memuat data.");

    }

}
