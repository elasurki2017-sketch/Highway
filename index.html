<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT JASA MANDIRI TECHGRAHA - Highway</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Plus Jakarta Sans',Arial,sans-serif}
html{width:100%;overflow-x:hidden}
body{
    background:
      radial-gradient(1200px 500px at 100% -10%,rgba(229,57,53,.06),transparent 60%),
      radial-gradient(1000px 500px at -10% 0%,rgba(30,64,175,.05),transparent 55%),
      #eef1f6;
    padding:14px;min-height:100vh;overflow-x:hidden;color:#1f2430
}
.header{
    position:sticky;top:0;z-index:10000;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    margin-bottom:18px;padding:12px 14px;border-radius:16px;
    border:1px solid rgba(226,232,240,.9);
    box-shadow:0 5px 18px rgba(15,23,42,.06);
    flex-wrap:wrap;transition:transform .3s ease
}
.header.hide-header{transform:translateY(-100%)}
.company h1{
    font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:800;
    letter-spacing:.2px;line-height:1.3;
    background:linear-gradient(90deg,#c62828,#e53935 55%,#ef5350);
    -webkit-background-clip:text;background-clip:text;color:transparent
}
.company p{font-size:10px;font-weight:600;color:#94a3b8;letter-spacing:.3px;margin-top:2px}
.profile-name{font-size:9px;margin-top:6px;color:#334155;font-weight:700;text-transform:uppercase;line-height:1.2}
.profile{
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;background:#fff;
    box-shadow:0 2px 10px rgba(30,41,59,.12),inset 0 0 0 1px rgba(15,23,42,.05);
    cursor:pointer;transition:.15s
}
.profile:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,41,59,.18)}
.menu-card,.period-card,.table-card{
    background:#fff;padding:18px;border-radius:18px;
    box-shadow:0 5px 20px rgba(15,23,42,.06);
    border:1px solid #e2e8f0;margin-bottom:18px
}
.menu-card{padding:10px}
.menu-row{display:flex;justify-content:center;align-items:center;gap:10px}
.menu-btn{
    flex:1;max-width:180px;height:46px;border:none;border-radius:12px;
    background:#f8fafc;color:#64748b;font-size:14px;font-weight:700;cursor:pointer;transition:.2s
}
.menu-btn:hover{background:#e2e8f0}
.menu-btn.active{
    background:linear-gradient(135deg,#e53935,#c62828);color:#fff;
    box-shadow:0 6px 16px -6px rgba(198,40,40,.5)
}
.period-row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.period-row label{font-weight:800;font-size:12px;color:#334155}
#monthSelect,#yearSelect{
    height:40px;width:140px;padding:0 14px;border:1px solid #dbe2ea;
    border-radius:10px;background:#f8fafc;color:#1e293b;font-size:13px;font-weight:700;
    text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;
    transition:.15s
}
#monthSelect:focus,#yearSelect:focus,input:focus,select:focus{
    outline:none;border-color:#ef4444;background:#fff;
    box-shadow:0 0 0 3px rgba(239,68,68,.10)
}
.table-header{margin-bottom:15px;display:flex;align-items:center;gap:8px}
.table-header h4{
    font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:800;
    color:#1e293b;position:relative;padding-left:12px
}
.table-header h4::before{
    content:"";position:absolute;left:0;top:1px;bottom:1px;width:4px;border-radius:5px;
    background:linear-gradient(180deg,#ef4444,#f97316)
}
.table-wrapper{width:100%;overflow-x:auto;border-radius:14px;scrollbar-width:thin}
#mainTable{
    width:100%;min-width:900px;border-collapse:separate;border-spacing:0;
    border:1px solid #cbd5e1;border-radius:14px;overflow:hidden;
    background:#fff;box-shadow:0 4px 14px rgba(15,23,42,.06);table-layout:fixed
}
#mainTable th{
    background:linear-gradient(180deg,#334155,#1e293b);color:#fff;
    border:1px solid #475569;padding:11px 8px;font-size:10px;font-weight:700;
    letter-spacing:.3px;white-space:nowrap
}
#mainTable td{
    border:1px solid #dbe2ea;padding:7px;font-size:9px;line-height:1.25;
    height:30px;vertical-align:middle;color:#334155;background:#fff
}
.group-even td,.group-even .date-cell,.group-even .total-cell{background:#fff}
.group-odd td,.group-odd .date-cell,.group-odd .total-cell{background:#f1f5f9}
#mainTable tbody tr:hover td{background:#f8fafc}
.date-cell{
    text-align:center;vertical-align:middle;font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:13px;color:#dc2626!important
}
.no-cell{text-align:center;font-weight:700;color:#64748b;vertical-align:middle}
.center-cell{text-align:center;vertical-align:middle}
.money-cell{text-align:right;padding-right:8px!important;font-weight:600;color:#334155}
.total-cell{
    text-align:center;vertical-align:middle;font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:10px;color:#166534!important;
    background:linear-gradient(135deg,#ecfdf5,#f0fdf4)!important;
    border-left:2px solid #86efac!important
}
.placeholder{color:#94a3b8!important;text-align:center;font-weight:500}
.action-cell{text-align:center;vertical-align:middle;background:#f8fafc!important}
.action-wrap{display:flex;justify-content:center;align-items:center;gap:5px}
.action-btn{
    border:none;width:25px;height:25px;padding:0;display:flex;align-items:center;justify-content:center;
    cursor:pointer;border-radius:7px;background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.10);
    font-size:12px;transition:.15s
}
.action-btn:hover{transform:translateY(-1px);background:#fef2f2;box-shadow:0 4px 10px rgba(15,23,42,.14)}
.bottom-actions{margin-top:18px;display:flex;justify-content:flex-end;align-items:flex-start;gap:12px}
.subtotal-box{
    min-width:270px;padding:14px 16px;border-radius:14px;border:1px solid #fecaca;
    background:linear-gradient(135deg,#fff7f7,#fff);
    box-shadow:0 6px 18px -8px rgba(220,38,38,.22);
    font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;color:#475569;
    position:relative;overflow:hidden
}
.subtotal-box:before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,#ef4444,#f97316)
}
.subtotal-value{float:right;color:#dc2626;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:14px}
.bottom-actions .primary-btn{min-height:42px;border-radius:10px;padding:10px 17px;font-size:11px}
.primary-btn{
    border:none;padding:11px 22px;cursor:pointer;border-radius:10px;
    background:linear-gradient(135deg,#e53935,#c62828);color:#fff;font-size:12px;font-weight:700;
    box-shadow:0 6px 16px -6px rgba(198,40,40,.55);transition:.12s
}
.primary-btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.primary-btn:active{transform:translateY(0);filter:brightness(.97)}
.secondary-btn{background:linear-gradient(135deg,#64748b,#475569);box-shadow:0 6px 16px -6px rgba(71,85,105,.4)}
.modal-overlay{
    position:fixed;inset:0;display:none;justify-content:center;align-items:center;
    background:rgba(15,23,42,.45);backdrop-filter:blur(3px);z-index:10000;padding:20px
}
.modal-card{
    width:100%;max-width:720px;background:#fff;border-radius:20px;padding:24px;
    box-shadow:0 20px 60px -12px rgba(15,23,42,.35);border:1px solid rgba(15,23,42,.05)
}
.modal-title{text-align:center;font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;margin-bottom:18px;color:#1e293b}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.input-grid label{display:block;margin-bottom:6px;font-weight:600;font-size:12px;color:#475569}
.full{grid-column:1/span 2}
input,select{
    width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;background:#f8fafc;
    border-radius:10px;outline:none;font-size:12px;color:#1f2430
}
#inputFlazz,#inputCash,#inputKm,.currency-input{text-align:center}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:25px}
.profile-table{width:100%;border-collapse:separate;border-spacing:0}
.profile-table td{font-size:12px;border:1px solid #e2e8f0;padding:6px}
.profile-table td:first-child{
    width:1%;white-space:nowrap;padding-right:12px;padding-left:10px;
    background:#f1f5f9;color:#475569;font-weight:700
}
.profile-table input{display:block;width:100%;height:42px;padding:0 12px}
.confirm-box{
    width:100%;max-width:360px;background:#fff;border-radius:18px;padding:26px;text-align:center;
    box-shadow:0 20px 60px -12px rgba(15,23,42,.35)
}
.confirm-text{font-size:14px;font-weight:600;color:#334155;margin-bottom:20px}
.confirm-buttons{display:flex;justify-content:center;gap:12px}
.loading-overlay{
    position:fixed;inset:0;display:none;justify-content:center;align-items:center;flex-direction:column;
    gap:14px;background:rgba(15,23,42,.72);backdrop-filter:blur(8px);z-index:20000;padding:20px
}
.loading-overlay.show{display:flex}
.loading-box{
    width:180px;padding:24px 18px;border-radius:20px;background:rgba(255,255,255,.96);
    box-shadow:0 20px 60px rgba(15,23,42,.30);display:flex;flex-direction:column;
    align-items:center;justify-content:center
}
.loading-spinner{width:52px;height:52px;border-radius:50%;border:4px solid #e2e8f0;border-top-color:#e53935;animation:spin .8s linear infinite}
.loading-text{margin-top:14px;font-size:12px;font-weight:700;color:#334155;text-align:center;min-height:18px}
.loading-success{
    display:none;width:52px;height:52px;border-radius:50%;background:#16a34a;color:#fff;
    font-size:30px;font-weight:800;align-items:center;justify-content:center
}
.loading-overlay.success .loading-spinner{display:none}
.loading-overlay.success .loading-success{display:flex}
.loading-overlay.success .loading-text{color:#166534}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden-datefull{display:none!important;width:0!important;min-width:0!important;max-width:0!important;padding:0!important;border:none!important}
th:nth-child(1),td.date-cell{width:40px;min-width:40px;max-width:40px;padding:2px;text-align:center}
th:nth-child(2),td.no-cell{width:35px;min-width:35px;max-width:35px;text-align:center}
th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){width:130px;min-width:130px;max-width:130px}
th:nth-child(7),td:nth-child(7),th:nth-child(8),td:nth-child(8){width:60px;min-width:60px;max-width:60px}
th:nth-child(9),td:nth-child(9){width:60px;min-width:60px;max-width:60px}
th:nth-child(10),td:nth-child(10){width:70px;min-width:70px;max-width:70px}
th:nth-child(11),td:nth-child(11),.action-cell{width:70px;min-width:70px;max-width:70px}
@media(max-width:768px){
    body{padding:10px}
    .input-grid{grid-template-columns:1fr}
    .full{grid-column:auto}
    .form-actions{flex-direction:column}
    .primary-btn{width:100%}
    .period-row{gap:7px}
    #monthSelect,#yearSelect{width:125px;height:38px;font-size:12px}
    .bottom-actions{flex-direction:column;align-items:stretch}
    .bottom-actions>div{width:100%}
    .subtotal-box{width:100%;min-width:0}
    #exportHighwayPdfBtn,#exportRekapBtn{width:100%}
}
::-webkit-scrollbar{height:7px;width:7px}
::-webkit-scrollbar-track{background:#f1f5f9;border-radius:10px}
::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#64748b}
</style>
</head>

<body>

<div class="header">
  <div class="company">
    <h1>PT JASA MANDIRI TECHGRAHA</h1>
    <p>Continuous Improvement!</p>
    <div id="profileNameDisplay" class="profile-name"></div>
  </div>
  <div class="profile" id="profileBtn">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="8" r="4" stroke="#9aa0a6" stroke-width="1.8"/>
      <path d="M5 20C5 16.5 8 14 12 14C16 14 19 16.5 19 20" stroke="#9aa0a6" stroke-width="1.8"/>
    </svg>
  </div>
</div>

<div class="menu-card">
  <div class="menu-row">
    <button id="highwayBtn" class="menu-btn active">🛣️ Highway</button>
  </div>
</div>

<div class="period-card">
  <div class="period-row">
    <label>Period</label>
    <select id="monthSelect">
      <option value="">Month</option>
      <option>Januari</option><option>Februari</option><option>Maret</option><option>April</option>
      <option>Mei</option><option>Juni</option><option>Juli</option><option>Agustus</option>
      <option>September</option><option>Oktober</option><option>November</option><option>Desember</option>
    </select>
    <select id="yearSelect">
      <option value="">Year</option>
      <option>2026</option><option>2027</option><option>2028</option><option>2029</option>
      <option>2030</option><option>2031</option><option>2032</option><option>2033</option>
      <option>2034</option><option>2035</option><option>2036</option><option>2037</option>
      <option>2038</option><option>2039</option><option>2040</option>
    </select>
  </div>
</div>

<div id="highwayCard" class="table-card">
  <div class="table-header"><h4>Detail Payment</h4></div>
  <div class="table-wrapper">
    <table id="mainTable">
      <thead><tr>
        <th>Date</th><th>No</th><th class="hidden-datefull">Date Full</th>
        <th>Start</th><th>Arrive</th><th>Parking Loc</th><th>Flazz</th><th>Cash</th>
        <th>KM</th><th>Total</th><th>Action</th>
      </tr></thead>
      <tbody id="tableBody">
        <tr id="placeholderRow">
          <td class="placeholder">-</td><td class="placeholder">-</td><td class="hidden-datefull">-</td>
          <td class="placeholder">-</td><td class="placeholder">-</td><td class="placeholder">-</td>
          <td class="placeholder">-</td><td class="placeholder">-</td><td class="placeholder">-</td>
          <td class="placeholder">-</td>
          <td class="action-cell"><button onclick="openFirstAdd()" class="action-btn">✏️</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="bottom-actions">
    <div style="width:100%">
      <div class="subtotal-box">
        <span>Sub Total</span>
        <span id="subtotalValue" class="subtotal-value">Rp 0</span>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap">
        <button id="exportHighwayPdfBtn" class="primary-btn">📄 Export PDF</button>
        <button id="exportRekapBtn" class="primary-btn secondary-btn">📊 Rekap PDF</button>
      </div>
    </div>
  </div>
</div>

<div id="profileModal" class="modal-overlay">
  <div class="modal-card">
    <h3 class="modal-title">PROFILE</h3>
    <table class="profile-table">
      <tr><td>Name</td><td><input id="employeeName" type="text" placeholder="Input Name"></td></tr>
      <tr><td>NIK</td><td><input id="employeeNik" type="text" placeholder="Input NIK"></td></tr>
      <tr><td>User</td><td><input id="employeeUser" type="text" placeholder="Input User"></td></tr>
      <tr><td>Car Number</td><td><input id="employeeLocation" type="text" placeholder="Input Car Number"></td></tr>
    </table>
    <div class="form-actions">
      <button id="closeProfileBtn" class="primary-btn secondary-btn">Cancel</button>
      <button id="saveProfileBtn" class="primary-btn">Save</button>
    </div>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-box">
    <div class="loading-spinner"></div><div class="loading-success">✓</div>
    <div class="loading-text">Memuat aplikasi...</div>
  </div>
</div>

<div id="formModal" class="modal-overlay">
  <div class="modal-card">
    <h3 class="modal-title">Input Highway</h3>
    <div class="input-grid">
      <div><label>Date Full</label><input id="inputDateFull" type="date"></div>
      <div><label>Start</label><input id="inputStart" type="text"></div>
      <div><label>Arrive</label><input id="inputArrive" type="text"></div>
      <div class="full"><label>Parking Location</label><input id="inputParking" type="text"></div>
      <div><label>Flazz</label><input id="inputFlazz" class="currency-input" type="text" inputmode="numeric" placeholder="Rp 0"></div>
      <div><label>Cash</label><input id="inputCash" class="currency-input" type="text" inputmode="numeric" placeholder="Rp 0"></div>
      <div><label>KM</label><input id="inputKm" type="number"></div>
    </div>
    <div class="form-actions">
      <button id="cancelFormBtn" class="primary-btn secondary-btn">Cancel</button>
      <button id="saveRowBtn" class="primary-btn">Save Data</button>
    </div>
  </div>
</div>

<div id="deleteConfirmModal" class="modal-overlay">
  <div class="confirm-box">
    <div class="confirm-text">Yakin ingin menghapus data ini?</div>
    <div class="confirm-buttons">
      <button id="cancelDeleteBtn" class="primary-btn secondary-btn">Cancel</button>
      <button id="confirmDeleteBtn" class="primary-btn">Delete</button>
    </div>
  </div>
</div>

<img id="signImage" src="sign.jpg" style="display:none;">

<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.js"></script>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyGfQO7FWGrMmzrcfpP6hoGAKYle3eIV_LNGjYw0KcK01MwfcwFvngu6hhDWrRk3HAH/exec";

let tableData=[],editIndex=null,deleteIndex=null,addBelowIndex=null,profileLocked=false;

const tableBody=document.getElementById("tableBody");
const subtotalValue=document.getElementById("subtotalValue");
const formModal=document.getElementById("formModal");
const profileModal=document.getElementById("profileModal");
const deleteConfirmModal=document.getElementById("deleteConfirmModal");
const cancelFormBtn=document.getElementById("cancelFormBtn");
const saveRowBtn=document.getElementById("saveRowBtn");
const cancelDeleteBtn=document.getElementById("cancelDeleteBtn");
const confirmDeleteBtn=document.getElementById("confirmDeleteBtn");
const profileBtn=document.getElementById("profileBtn");
const closeProfileBtn=document.getElementById("closeProfileBtn");
const saveProfileBtn=document.getElementById("saveProfileBtn");
const profileNameDisplay=document.getElementById("profileNameDisplay");
const inputDateFull=document.getElementById("inputDateFull");
const inputStart=document.getElementById("inputStart");
const inputArrive=document.getElementById("inputArrive");
const inputParking=document.getElementById("inputParking");
const inputFlazz=document.getElementById("inputFlazz");
const inputCash=document.getElementById("inputCash");
const inputKm=document.getElementById("inputKm");
const monthSelect=document.getElementById("monthSelect");
const yearSelect=document.getElementById("yearSelect");
const loadingOverlay=document.getElementById("loadingOverlay");
const loadingText=loadingOverlay.querySelector(".loading-text");

function openModal(m){if(m)m.style.display="flex"}
function closeModal(m){if(m)m.style.display="none"}

window.openFirstAdd=function(){clearForm();editIndex=null;addBelowIndex=null;openModal(formModal)}
cancelFormBtn.onclick=()=>{clearForm();closeModal(formModal)}
profileBtn.onclick=()=>openModal(profileModal)
closeProfileBtn.onclick=()=>closeModal(profileModal)
saveProfileBtn.onclick=()=>profileLocked?setProfileLock(false):saveProfile()

function generateId(){return"ID_"+Date.now()}
function formatRupiah(value){
  value=String(value).replace(/\D/g,""); if(value==="")return "";
  return"Rp "+Number(value).toLocaleString("id-ID")
}
function parseRupiah(value){return Number(String(value).replace(/[^\d]/g,"")||0)}
function extractDate(dateFull){
  if(!dateFull)return"";
  const d=new Date(dateFull); return isNaN(d.getTime())?"":d.getDate()
}
function calculateSubtotal(data=tableData){
  return data.reduce((t,i)=>t+Number(i.flazz||0)+Number(i.cash||0),0)
}
function saveLastPeriod(){
  localStorage.setItem("lastMonth",monthSelect.value);
  localStorage.setItem("lastYear",yearSelect.value)
}
function loadLastPeriod(){
  const m=localStorage.getItem("lastMonth"),y=localStorage.getItem("lastYear");
  if(m)monthSelect.value=m;if(y)yearSelect.value=y
}
const monthMap={Januari:1,Februari:2,Maret:3,April:4,Mei:5,Juni:6,Juli:7,Agustus:8,September:9,Oktober:10,November:11,Desember:12};

function getFilteredData(){
  const m=monthSelect.value,y=Number(yearSelect.value);
  if(!m||!y)return tableData;
  return tableData.filter(i=>{
    if(!i.dateFull)return false;const d=new Date(i.dateFull);
    return d.getMonth()+1===monthMap[m]&&d.getFullYear()===y
  })
}
function applyPeriodFilter(){renderTable(getFilteredData())}

async function sendApi(data){
  try{
    const form=new FormData();form.append("data",JSON.stringify(data));
    const response=await fetch(API_URL,{method:"POST",body:form});
    const result=await response.json();
    if(result.status)return true;
    alert(result.error||"Gagal menyimpan data.");return false
  }catch(e){alert("Error : "+e.message);return false}
}

async function reloadHighway(){
  return new Promise(resolve=>{
    const period=monthSelect.value+"-"+yearSelect.value;
    const callback="highwayCallback_"+Date.now(),script=document.createElement("script");
    function cleanup(){delete window[callback];if(script.parentNode)script.parentNode.removeChild(script)}
    window[callback]=function(rows){
      cleanup();tableData=Array.isArray(rows)?rows:[];applyPeriodFilter();resolve(tableData)
    };
    script.src=API_URL+"?callback="+callback+"&period="+encodeURIComponent(period);
    script.onerror=function(){cleanup();tableData=[];renderTable([]);resolve([])};
    document.head.appendChild(script)
  })
}

function updateSubtotal(data=tableData){subtotalValue.textContent=formatRupiah(calculateSubtotal(data))}

function groupByDate(data){
  const g={};data.forEach(i=>{if(!g[i.dateFull])g[i.dateFull]=[];g[i.dateFull].push(i)});return g
}

function createHighwayRow(row,rows,rowIndex,rowClass,total){
return `<tr class="${rowClass}">
${rowIndex===0?`<td class="date-cell" rowspan="${rows.length}">${extractDate(row.dateFull)}</td>`:""}
<td class="no-cell">${rowIndex+1}</td>
${rowIndex===0?`<td class="hidden-datefull" rowspan="${rows.length}">${row.dateFull}</td>`:""}
<td class="center-cell">${row.start||""}</td>
<td class="center-cell">${row.arrive||""}</td>
<td class="center-cell">${row.parking||""}</td>
<td class="money-cell">${row.flazz?formatRupiah(row.flazz):""}</td>
<td class="money-cell">${row.cash?formatRupiah(row.cash):""}</td>
<td class="center-cell">${row.km||""}</td>
${rowIndex===0?`<td class="total-cell" rowspan="${rows.length}">${total?formatRupiah(total):""}</td>`:""}
<td class="action-cell"><div class="action-wrap">
<button class="action-btn" onclick="editRow('${row.id}')">✏️</button>
<button class="action-btn" onclick="askDelete('${row.id}')">🗑️</button>
<button class="action-btn" onclick="addNewRow('${row.id}')">➕</button>
</div></td></tr>`
}

function renderEmptyTable(){
  tableBody.innerHTML=`<tr>
<td class="placeholder">-</td><td class="placeholder">-</td><td class="hidden-datefull">-</td>
<td class="placeholder">-</td><td class="placeholder">-</td><td class="placeholder">-</td>
<td class="placeholder">-</td><td class="placeholder">-</td><td class="placeholder">-</td><td class="placeholder">-</td>
<td class="action-cell"><button class="action-btn" onclick="openFirstAdd()">✏️</button></td></tr>`
}

function renderTable(data=tableData){
  if(!data.length){renderEmptyTable();updateSubtotal([]);return}
  data.sort((a,b)=>new Date(a.dateFull)-new Date(b.dateFull));
  const grouped=groupByDate(data);let html="";
  Object.keys(grouped).forEach((dateKey,gi)=>{
    const rows=grouped[dateKey],cls=gi%2===0?"group-even":"group-odd",total=calculateSubtotal(rows);
    rows.forEach((r,ri)=>html+=createHighwayRow(r,rows,ri,cls,total))
  });
  tableBody.innerHTML=html;updateSubtotal(data)
}

function clearForm(){
  inputDateFull.value="";inputStart.value="";inputArrive.value="";inputParking.value="";
  inputFlazz.value="";inputCash.value="";inputKm.value="";editIndex=null;addBelowIndex=null
}
function fillForm(d){
  inputDateFull.value=d.dateFull||"";inputStart.value=d.start||"";inputArrive.value=d.arrive||"";
  inputParking.value=d.parking||"";inputFlazz.value=d.flazz?formatRupiah(d.flazz):"";
  inputCash.value=d.cash?formatRupiah(d.cash):"";inputKm.value=d.km||""
}
function getFormData(){
  const flazz=parseRupiah(inputFlazz.value),cash=parseRupiah(inputCash.value);
  return{
    id:editIndex||generateId(),dateFull:inputDateFull.value,start:inputStart.value.trim(),
    arrive:inputArrive.value.trim(),parking:inputParking.value.trim(),
    flazz:flazz===0?"":flazz,cash:cash===0?"":cash,km:inputKm.value.trim(),
    period:monthSelect.value+"-"+yearSelect.value
  }
}
function validateForm(){
  if(!inputDateFull.value){alert("Date wajib diisi.");inputDateFull.focus();return false}
  const lokasi=inputStart.value.trim()||inputArrive.value.trim()||inputParking.value.trim();
  if(!lokasi){alert("Isi minimal Start, Arrive, atau Parking.");return false}
  if(parseRupiah(inputFlazz.value)+parseRupiah(inputCash.value)===0){alert("Isi minimal Flazz atau Cash.");return false}
  return true
}
function validatePeriod(){
  const nama=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const [tahun,bulan]=inputDateFull.value.split("-");
  const pc=monthSelect.value+"-"+yearSelect.value,pd=nama[Number(bulan)-1]+"-"+tahun;
  if(pc!==pd){alert(`Periode harus sama.\n\nPeriod Card : ${pc}\nTanggal : ${pd}`);inputDateFull.focus();return false}
  return true
}
inputFlazz.addEventListener("input",()=>inputFlazz.value=formatRupiah(inputFlazz.value));
inputCash.addEventListener("input",()=>inputCash.value=formatRupiah(inputCash.value));

saveRowBtn.onclick=async function(){
  if(!validateProfilePeriod()||!validateForm()||!validatePeriod())return;
  saveLastPeriod();if(!confirm("Data sudah benar?"))return;
  const data=getFormData();data.action=editIndex?"update":"add";
  showLoading("Menyimpan data Highway...");
  if(!await sendApi(data)){hideLoading();return}
  showLoading("Memperbarui data...");await reloadHighway();showSuccess("Data Highway berhasil disimpan");
  await new Promise(r=>setTimeout(r,800));hideLoading();clearForm();closeModal(formModal)
}
window.editRow=function(id){const r=tableData.find(i=>i.id===id);if(!r)return;editIndex=id;fillForm(r);openModal(formModal)}
window.addNewRow=function(id){clearForm();addBelowIndex=id;editIndex=null;openModal(formModal)}
window.askDelete=function(id){deleteIndex=id;openModal(deleteConfirmModal)}
confirmDeleteBtn.onclick=async function(){
  if(!deleteIndex)return;
  const ok=await sendApi({action:"delete",id:deleteIndex,period:monthSelect.value+"-"+yearSelect.value});
  if(ok)await reloadHighway();deleteIndex=null;closeModal(deleteConfirmModal)
}
cancelDeleteBtn.onclick=()=>{deleteIndex=null;closeModal(deleteConfirmModal)}

function setProfileLock(lock){
  profileLocked=lock;
  ["employeeName","employeeNik","employeeUser","employeeLocation"].forEach(id=>document.getElementById(id).readOnly=lock);
  saveProfileBtn.textContent=lock?"Edit":"Save"
}
function saveProfile(){
  const p={
    employeeName:document.getElementById("employeeName").value.trim(),
    employeeNik:document.getElementById("employeeNik").value.trim(),
    employeeUser:document.getElementById("employeeUser").value.trim(),
    employeeCar:document.getElementById("employeeLocation").value.trim()
  };
  Object.entries({employeeName:p.employeeName,employeeNik:p.employeeNik,employeeUser:p.employeeUser,employeeCar:p.employeeCar})
    .forEach(([k,v])=>localStorage.setItem(k,v));
  profileNameDisplay.textContent=p.employeeName;setProfileLock(true)
}
function loadProfile(){
  const p={
    employeeName:localStorage.getItem("employeeName")||"",
    employeeNik:localStorage.getItem("employeeNik")||"",
    employeeUser:localStorage.getItem("employeeUser")||"",
    employeeCar:localStorage.getItem("employeeCar")||""
  };
  document.getElementById("employeeName").value=p.employeeName;
  document.getElementById("employeeNik").value=p.employeeNik;
  document.getElementById("employeeUser").value=p.employeeUser;
  document.getElementById("employeeLocation").value=p.employeeCar;
  profileNameDisplay.textContent=p.employeeName;setProfileLock(p.employeeName!=="")
}
function getProfile(){
  return{
    name:localStorage.getItem("employeeName")||"",
    nik:localStorage.getItem("employeeNik")||"",
    user:localStorage.getItem("employeeUser")||"",
    car:localStorage.getItem("employeeCar")||""
  }
}
function validateProfilePeriod(){
  if(!monthSelect.value||!yearSelect.value){alert("Silakan pilih periode terlebih dahulu.");return false}
  const p=getProfile();
  if(!p.name||!p.nik||!p.user||!p.car){alert("Lengkapi Profile terlebih dahulu.");openModal(profileModal);return false}
  return true
}

monthSelect.addEventListener("change",()=>{saveLastPeriod();applyPeriodFilter()});
yearSelect.addEventListener("change",()=>{saveLastPeriod();applyPeriodFilter()});

function showLoading(msg="Memuat aplikasi..."){loadingOverlay.classList.remove("success");loadingText.textContent=msg;loadingOverlay.classList.add("show")}
function showSuccess(msg="Data berhasil disimpan"){loadingText.textContent=msg;loadingOverlay.classList.add("success")}
function hideLoading(){loadingOverlay.classList.remove("show");setTimeout(()=>loadingOverlay.classList.remove("success"),350)}

async function initializeHighway(){loadProfile();loadLastPeriod();await reloadHighway()}
window.addEventListener("DOMContentLoaded",async()=>{
  showLoading("Memuat aplikasi...");
  try{await initializeHighway();await new Promise(r=>setTimeout(r,300));showSuccess("Data siap digunakan");await new Promise(r=>setTimeout(r,700))}
  catch(e){console.error(e);loadingText.textContent="Gagal memuat data";await new Promise(r=>setTimeout(r,1200))}
  finally{hideLoading()}
})

/* PDF tetap menggunakan fungsi Highway yang sudah ada di kode sebelumnya.
   Tombol dipertahankan dan akan terhubung bila fungsi exportPDF tersedia. */
document.getElementById("exportHighwayPdfBtn").addEventListener("click",()=>{
  if(typeof exportPDF==="function")exportPDF();else alert("Fungsi Export Highway PDF belum tersedia pada file ini.")
})
document.getElementById("exportRekapBtn").addEventListener("click",()=>{
  if(typeof exportRekapPDF==="function")exportRekapPDF();
  else if(typeof exportPDF==="function")exportPDF();
  else alert("Fungsi Rekap PDF belum tersedia pada file ini.")
})
</script>
